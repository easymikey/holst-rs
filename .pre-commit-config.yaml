minimum_pre_commit_version: 3.2.0
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: fmt
        name: fmt
        entry: just fmt
        pass_filenames: false
        language: system
        always_run: true
  - repo: https://github.com/DevinR528/cargo-sort
    rev: v2.1.3
    hooks:
      - id: cargo-sort
        args: ["--workspace", "--grouped"]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
  - repo: local
    hooks:
      - id: clippy
        name: clippy
        entry: just clippy
        pass_filenames: false
        language: system
        always_run: true
  - repo: local
    hooks:
      - id: tests
        name: tests
        entry: just test
        pass_filenames: false
        language: system
        always_run: true
        stages: [pre-push]
  - repo: local
    hooks:
      - id: doctests
        name: doctests
        entry: cargo test --doc
        pass_filenames: false
        language: system
        always_run: true
        stages: [pre-push]
