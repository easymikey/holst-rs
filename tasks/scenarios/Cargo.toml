[package]
name = "holst-scenarios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Behaviour scenarios run through the holst and holst-mcp binaries against one fake Holst server"
# One test binary: `tests/main.rs` holds a module per area.
autotests = false

[dependencies]
# The fake Holst server (`holst_core::fake`).
holst-core = { path = "../../crates/holst-core", features = ["fake"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process"] }
# The MCP side of a scenario is a real client talking to the built `holst-mcp`.
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process"] }

[dev-dependencies]
rstest = { version = "0.28", default-features = false }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
