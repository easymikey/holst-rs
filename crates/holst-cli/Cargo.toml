[package]
name = "holst-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["holst", "whiteboard", "cli"]
categories = ["command-line-utilities"]
description = "Unofficial command-line client for Holst (app.holst.so)"

[[bin]]
name = "holst"
path = "src/main.rs"

[dependencies]
holst-core = { path = "../holst-core", version = "0.3.0", features = ["logging"] }
holst-form = { path = "../holst-form", version = "0.3.0" }
thiserror.workspace = true
secrecy.workspace = true
zeroize.workspace = true
clap = { workspace = true, features = ["env", "string"] }
derive_more.workspace = true
console = { version = "0.16", default-features = false, features = ["std", "unicode-width", "ansi-parsing"] }
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "sync"] }

[dev-dependencies]
holst-form = { path = "../holst-form", features = ["fake"] }
holst-core = { path = "../holst-core", features = ["fake"] }
yrs.workspace = true
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
rstest = { version = "0.28", default-features = false }
insta = { version = "1.49", features = ["json"] }
expectrl.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "test-util"] }

[features]
default = ["png"]
png = ["holst-core/png"]

[lints]
workspace = true
