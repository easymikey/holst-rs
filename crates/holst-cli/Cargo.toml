[package]
name = "holst-cli"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["holst", "whiteboard", "cli"]
categories = ["command-line-utilities"]
description = "Unofficial command-line client for Holst (app.holst.so)"

[[bin]]
name = "holst"
path = "src/main.rs"

[dependencies]
holst-core = { path = "../holst-core", version = "0.4.0", features = ["logging"] }
clacky = { workspace = true }
thiserror.workspace = true
secrecy.workspace = true
clap = { workspace = true, features = ["env", "string"] }
derive_more.workspace = true
console = { version = "0.16", default-features = false, features = ["std", "unicode-width", "ansi-parsing"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "sync"] }

[dev-dependencies]
clacky = { workspace = true, features = ["fake"] }
holst-core = { path = "../holst-core", features = ["fake"] }
yrs.workspace = true
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
rstest = { version = "0.28", default-features = false }
insta = { version = "1.49", features = ["json"] }
expectrl.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "test-util"] }

[features]
default = ["png"]
png = ["holst-core/png"]

[lints]
workspace = true

# The root changelog is shared by every crate, so only holst-cli, released every time, renames its heading.
[package.metadata.release]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} ({{date}})", exactly = 1 },
]
