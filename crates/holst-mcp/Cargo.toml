[package]
name = "holst-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["holst", "whiteboard", "mcp", "ai"]
categories = ["development-tools", "api-bindings"]
description = "Unofficial MCP server for Holst (app.holst.so)"

[[bin]]
name = "holst-mcp"
path = "src/main.rs"

[dependencies]
itertools.workspace = true
holst-core = { path = "../holst-core", version = "0.1.0", features = ["logging"] }
thiserror.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync", "net"] }
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
getrandom = "0.4"
subtle = "2"
tracing.workspace = true
arc-swap.workspace = true
yrs.workspace = true
base64 = { version = "0.23", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
rstest = { version = "0.28", default-features = false }
insta = { version = "1.49", features = ["json"] }
reqwest.workspace = true
strum.workspace = true
holst-core = { path = "../holst-core", features = ["fake"] }
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }


[features]
default = ["png"]
png = ["holst-core/png"]

[lints]
workspace = true
