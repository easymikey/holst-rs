[package]
name = "holst-mcp"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["holst", "whiteboard", "mcp", "ai"]
categories = ["development-tools", "api-bindings"]
description = "Unofficial MCP server for Holst (app.holst.so)"

[[bin]]
name = "holst-mcp"
path = "src/main.rs"

[dependencies]
itertools.workspace = true
holst-core = { workspace = true, features = ["logging"] }
clacky = { workspace = true, features = ["secrecy"] }
futures-util.workspace = true
thiserror.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync", "net"] }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
getrandom.workspace = true
subtle.workspace = true
tracing.workspace = true
arc-swap.workspace = true
yrs.workspace = true
base64.workspace = true

[dev-dependencies]
rstest.workspace = true
insta.workspace = true
reqwest.workspace = true
strum.workspace = true
holst-core = { workspace = true, features = ["fake"] }
clacky = { workspace = true, features = ["fake"] }
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }


[features]
default = ["png"]
png = ["holst-core/png"]

[lints]
workspace = true
