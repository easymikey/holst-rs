[package]
name = "holst-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["holst", "whiteboard", "mcp", "ai"]
categories = ["development-tools", "api-bindings"]
description = "MCP server for Holst (app.holst.so)"

[[bin]]
name = "holst-mcp"
path = "src/main.rs"

[dependencies]
itertools.workspace = true
holst-core = { path = "../holst-core", version = "0.1.0", features = ["logging"] }
thiserror.workspace = true
# The typed code or password of `setup` and the tokens of the test sessions.
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# tokio::fs reads the file for upload; spawn_blocking writes a backup and
# reaches the login store; sync::Mutex lets one call read the store while
# the others wait without holding a worker thread.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync"] }
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io"] }
tracing.workspace = true
# The login and the workspace list are read without locks; aliases and tree cache use std.
arc-swap.workspace = true
# The board document: kept boards are seeds of the next load.
yrs.workspace = true
# Already built through reqwest: PNG pictures go to the model as base64.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# Echo off while a code or password is typed; already built for the CLI.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
rstest = { version = "0.28", default-features = false }
insta = { version = "1.49", features = ["json"] }
# HeaderMap for the scripted transport in tests.
reqwest.workspace = true
# Labels of the login state machine in tests.
strum.workspace = true
# The fake Holst server for the board loads of the server tests.
holst-core = { path = "../holst-core", features = ["fake"] }
# The client that asks the built binary for its tools.
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process"] }


[features]
# `board` snap answers with a PNG image the model can see; without it, only SVG.
default = ["png"]
png = ["holst-core/png"]

[lints]
workspace = true
