[package]
name = "holst-core"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["holst", "whiteboard", "api", "client"]
categories = ["api-bindings"]
description = "Unofficial client for Holst (app.holst.so): the REST API and the live board sync"
autobenches = false
autotests = false

[dependencies]
itertools.workspace = true
holst-macros.workspace = true
thiserror.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
uuid.workspace = true
memchr.workspace = true
idna_adapter.workspace = true
url.workspace = true
pulldown-cmark.workspace = true
icu_normalizer.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }
hyper-util = { workspace = true, features = ["client-proxy"] }
strum.workspace = true
derive_more.workspace = true
zeroize.workspace = true
tracing-subscriber = { workspace = true, optional = true }
yrs.workspace = true
tokio-tungstenite.workspace = true
tungstenite.workspace = true
futures-util.workspace = true
flate2.workspace = true
postcard.workspace = true
base64.workspace = true
resvg = { workspace = true, optional = true }

[dev-dependencies]
divan.workspace = true
rstest.workspace = true
insta.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
holst-core = { path = ".", features = ["fake"] }

[[test]]
name = "main"
path = "tests/main.rs"

[[bench]]
name = "pure"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "content"
harness = false

[[bench]]
name = "cache"
harness = false

[features]
logging = ["dep:tracing-subscriber"]
png = ["dep:resvg"]
fake = []

# keyring 4's default `v1` feature wires the native store per OS; there is no mock fallback.
[target.'cfg(windows)'.dependencies]
keyring.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring.workspace = true
secret-service.workspace = true
zbus.workspace = true

[package.metadata.cargo-machete]
ignored = ["idna_adapter"]

[lints]
workspace = true
