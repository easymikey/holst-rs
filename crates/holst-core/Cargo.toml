[package]
name = "holst-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["holst", "whiteboard", "api", "client"]
categories = ["api-bindings"]
description = "Unofficial client for Holst (app.holst.so): the REST API and the live board sync"
autobenches = false
autotests = false

[dependencies]
itertools.workspace = true
holst-macros.workspace = true
thiserror.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
uuid.workspace = true
memchr = "2"
# The no-op IDNA backend of `url`: ASCII hosts only; 1.2 changes how Unicode hosts parse.
idna_adapter = "=1.0.0"
pulldown-cmark = { version = "0.13", default-features = false }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy"] }
strum.workspace = true
derive_more.workspace = true
zeroize.workspace = true
tracing-subscriber = { workspace = true, optional = true }
yrs.workspace = true
tokio-tungstenite.workspace = true
tungstenite.workspace = true
futures-util.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
resvg = { workspace = true, optional = true }

[dev-dependencies]
divan = { version = "0.1", default-features = false }
rstest = { version = "0.28", default-features = false }
insta = { version = "1.49", features = ["json"] }
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
holst-core = { path = ".", features = ["fake"] }

[[test]]
name = "main"
path = "tests/main.rs"

[[bench]]
name = "pure"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "content"
harness = false

[[bench]]
name = "cache"
harness = false

[features]
logging = ["dep:tracing-subscriber"]
png = ["dep:resvg"]
fake = []

# Without an explicit backend per OS, keyring silently uses a mock store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
secret-service = { version = "5", default-features = false }
zbus = { version = "4", default-features = false }

[package.metadata.cargo-machete]
ignored = ["idna_adapter"]

[lints]
workspace = true
