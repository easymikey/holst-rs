[package]
name = "holst-scenarios"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Behaviour scenarios run through the holst and holst-mcp binaries against one fake Holst server"
autotests = false

[dependencies]
holst-core = { workspace = true, features = ["fake"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "sync", "signal"] }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[dev-dependencies]
rstest.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true

[package.metadata.release]
release = false
