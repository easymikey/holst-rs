name: release

on:
  push:
    tags: ["holst-*-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  draft:
    if: github.repository_owner == 'easymikey'
    runs-on: ubuntu-latest
    outputs:
      binaries: ${{ steps.kind.outputs.binaries }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo bin just release-notes "$TAG" > notes.md
      - run: gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file notes.md
      - id: kind
        run: |
          case "$TAG" in
            holst-cli-v* | holst-mcp-v*) echo "binaries=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "binaries=false" >> "$GITHUB_OUTPUT" ;;
          esac

  dist:
    needs: draft
    if: needs.draft.outputs.binaries == 'true'
    name: dist (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15-intel
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            full: "true"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            full: "true"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          full: ${{ matrix.full || 'false' }}
          key: ${{ matrix.target }}
      - run: cargo bin just dist ${{ matrix.target }}
      - run: cargo bin just upload "$TAG" ${{ matrix.target }}

  homebrew:
    needs: [draft, dist]
    runs-on: ubuntu-latest
    # The cli and mcp tags are pushed together; their tap pushes must not race.
    concurrency:
      group: homebrew
      cancel-in-progress: false
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo bin just homebrew "$TAG"

  publish:
    needs: [draft, dist, homebrew]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --draft=false
