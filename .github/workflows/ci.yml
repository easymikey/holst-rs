name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev

      - uses: ./.github/actions/tools
        with:
          components: rustfmt

      - run: cargo bin just lint

  deps:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/tools

      - uses: Swatinem/rust-cache@v2

      - run: cargo bin just deps

  check:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/tools

      - uses: Swatinem/rust-cache@v2

      - run: cargo bin just check

  budget:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/tools

      - uses: Swatinem/rust-cache@v2

      - run: cargo bin just budget
