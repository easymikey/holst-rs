name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            recipes: lint check deps features
            full: "true"
          - os: ubuntu-24.04-arm
            recipes: clippy check
          - os: macos-15-intel
            recipes: clippy check
          - os: windows-latest
            recipes: clippy check
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          full: ${{ matrix.full || 'false' }}
      - run: cargo bin just ${{ matrix.recipes }}
      - if: runner.os == 'Linux' && runner.arch == 'X64' && github.event_name == 'pull_request'
        run: cargo bin just commits ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - if: runner.os == 'Linux' && runner.arch == 'X64' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: cargo bin just commits ${{ github.event.before }}..${{ github.sha }}
